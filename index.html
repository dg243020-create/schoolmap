<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>大商学園 校内マップ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>大商学園 校内マップ</h1>
</header>


<main>

    <!-- =========================
         通常の目的地検索
    ========================== -->

    <section class="control-panel">

        <div class="select-group">

            <label for="building">
                建物
            </label>

            <select id="building">

                <option value="">
                    建物を選択
                </option>

                <option value="S">
                    新館
                </option>

                <option value="AB">
                    AB館
                </option>

                <option value="G">
                    グラウンド側
                </option>

            </select>

        </div>


        <div class="select-group">

            <label for="floor">
                階
            </label>

            <select id="floor">

                <option value="">
                    階を選択
                </option>

            </select>

        </div>


        <div class="select-group destination-group">

            <label for="destination">
                目的地
            </label>

            <select
                id="destination"
                onchange="showDestination()"
            >

                <option value="">
                    目的地を選択
                </option>

            </select>

        </div>

    </section>


    <!-- =========================
         地図
    ========================== -->

    <section id="map-wrapper">

        <div id="map-container">

            <img
                id="map"
                src=""
                alt="校内地図"
            >

            <!-- 目的地マーカー -->
            <div id="marker"></div>

            <!-- 文化祭クリック範囲 -->
            <div id="classroom-layer"></div>

        </div>

    </section>


    <!-- =========================
         文化祭ポップアップ
    ========================== -->

    <div
        id="festival-modal"
        class="modal"
    >

        <div class="modal-content">

            <button
                class="modal-close"
                onclick="closeFestivalModal()"
                aria-label="閉じる"
            >
                ×
            </button>


            <h2 id="festival-title">
                企画名
            </h2>


            <div
                id="festival-image-container"
                class="festival-image-container"
            >

                <img
                    id="festival-image"
                    src=""
                    alt=""
                >

            </div>


            <p id="festival-description">
                紹介文
            </p>

        </div>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>

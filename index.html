<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>大商学園 校内マップ</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================
     ヘッダー
===================== -->

<header>

    <h1>
        大商学園 校内マップ
    </h1>

</header>



<!-- =====================
     建物・階
===================== -->

<div class="floor-select">


    <select id="building">

        <option value="">
            建物を選択
        </option>

        <option value="AB">
            AB館
        </option>

    </select>



    <select id="floor">

        <option value="">
            階を選択
        </option>

    </select>


</div>



<!-- =====================
     地図
===================== -->

<div id="map-wrapper">

    <div id="map-container">

        <img
            id="map"
            src="AB1F.png"
            alt="校内マップ"
        >

        <div id="classroom-layer"></div>

    </div>

</div>



<!-- =====================
     文化祭ポップアップ
===================== -->

<div
    id="festival-modal"
    class="festival-modal"
>

<div
    id="festival-content"
    class="festival-modal-content"
>

        <button
            id="festival-close"
            class="festival-close"
            onclick="closeFestivalModal()"
        >
            ×
        </button>


        <h2 id="festival-title"></h2>


        <div
            id="festival-image-container"
            class="festival-image-container"
        >

            <img
                id="festival-image"
                src=""
                alt="文化祭企画"
            >

        </div>


        <p id="festival-description"></p>

    </div>

</div>

<!-- =====================
     模擬店マップポップアップ
===================== -->

<div
    id="stall-modal"
    class="stall-modal"
>

    <div class="stall-modal-content">

        <p>
            模擬店マップに移動しますか？
        </p>

        <div class="stall-modal-buttons">

            <button
                id="stall-yes"
                onclick="goToStallMap()"
            >
                はい
            </button>

            <button
                id="stall-no"
                onclick="closeStallModal()"
            >
                いいえ
            </button>

        </div>

    </div>

</div>

<!-- =====================
     アンケート
===================== -->

<section class="survey">

    <h2>
        ご協力お願いします
    </h2>


    <p>
        より使いやすい校内マップにするため、<br>
        アンケートへのご協力をお願いします。
    </p>


    <a
        href="https://docs.google.com/forms/d/e/1FAIpQLScHAQ7Bb5pybXmkcQGz82Oxv5hUuDgrsDF0ePRvq0drNrjCxw/viewform"
        target="_blank"
        rel="noopener noreferrer"
    >

        <button>
            アンケートに回答する
        </button>

    </a>

</section>



<!-- =====================
     フッター
===================== -->

<footer>

    <p>
        © 2026 Information Creative Course Inc.
    </p>

</footer>



<script src="script.js"></script>

</body>

</html>

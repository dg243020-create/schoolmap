<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>校内マップ 座標確認ツール</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <h1>
        校内マップ 座標確認ツール
    </h1>

    <p>
        地図上をドラッグしてクリック範囲を作成してください
    </p>

</header>



<!-- =====================
     建物・階
===================== -->

<div class="controls">


    <select id="building">

        <option value="">
            建物を選択
        </option>

        <option value="S">
            新館
        </option>

        <option value="AB">
            AB館
        </option>

        <option value="G">
            グラウンド側
        </option>

    </select>



    <select id="floor">

        <option value="">
            階を選択
        </option>

    </select>


</div>



<!-- =====================
     地図
===================== -->

<div id="map-container">


    <img
        id="map"
        src="AB1F.png"
        alt="校内マップ"
    >


    <!-- ドラッグ範囲 -->

    <div id="selection"></div>


</div>



<!-- =====================
     座標結果
===================== -->

<section class="result">


    <h2>
        選択範囲
    </h2>


    <div class="coordinate-grid">


        <div>

            <span>
                X
            </span>

            <strong id="x">
                ---
            </strong>

        </div>


        <div>

            <span>
                Y
            </span>

            <strong id="y">
                ---
            </strong>

        </div>


        <div>

            <span>
                Width
            </span>

            <strong id="width">
                ---
            </strong>

        </div>


        <div>

            <span>
                Height
            </span>

            <strong id="height">
                ---
            </strong>

        </div>


    </div>



    <!-- JSにそのまま貼る用 -->

    <div class="code-result">

        <p>
            JS用
        </p>


        <code id="code">
            x: ---,
            y: ---,
            width: ---,
            height: ---
        </code>


        <button id="copy-button">
            コピー
        </button>

    </div>


</section>



<!-- =====================
     説明
===================== -->

<section class="help">

    <h2>
        使い方
    </h2>

    <ol>

        <li>
            建物と階を選択
        </li>

        <li>
            地図上で、教室の左上から右下までドラッグ
        </li>

        <li>
            X・Y・Width・Heightが自動で表示されます
        </li>

        <li>
            「コピー」でJSに貼り付けられます
        </li>

    </ol>

</section>



<script src="script.js"></script>

</body>

</html>

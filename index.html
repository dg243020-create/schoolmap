<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>文化祭クリック範囲 座標取得ツール</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header>
    <h1>文化祭クリック範囲 座標取得ツール</h1>
</header>


<!-- =========================================
     操作部分
========================================= -->

<section class="controls">

    <div class="control-row">

        <label>
            建物
        </label>

        <select id="building">

            <option value="S">
                新館
            </option>

            <option value="AB">
                AB館
            </option>

            <option value="G">
                グラウンド側
            </option>

        </select>


        <label>
            階
        </label>

        <select id="floor">

            <option value="1">
                1階
            </option>

            <option value="2">
                2階
            </option>

            <option value="3">
                3階
            </option>

            <option value="4">
                4階
            </option>

            <option value="5">
                5階
            </option>

            <option value="6">
                6階
            </option>

        </select>

    </div>


    <div class="control-row">

        <label>
            画像ファイル
        </label>

        <input
            type="text"
            id="imageFile"
            value="test.png"
            placeholder="例：test.png"
        >

        <button id="loadButton">
            地図を読み込む
        </button>

    </div>


    <div class="control-row">

        <label>
            クラス番号
        </label>

        <input
            type="text"
            id="roomName"
            placeholder="例：11"
        >

    </div>

</section>


<!-- =========================================
     座標表示
========================================= -->

<section class="coordinate-panel">

    <h2>
        選択範囲
    </h2>

    <div class="coordinate-grid">

        <div>
            <span>X</span>
            <strong id="coordX">---</strong>
        </div>

        <div>
            <span>Y</span>
            <strong id="coordY">---</strong>
        </div>

        <div>
            <span>WIDTH</span>
            <strong id="coordWidth">---</strong>
        </div>

        <div>
            <span>HEIGHT</span>
            <strong id="coordHeight">---</strong>
        </div>

    </div>


    <h3>
        classroomAreas 用コード
    </h3>

    <textarea
        id="codeOutput"
        readonly
        placeholder="地図上をドラッグするとここにコードが表示されます。"
    ></textarea>

    <button
        id="copyButton"
        class="copy-button"
    >
        コードをコピー
    </button>

</section>


<!-- =========================================
     地図
========================================= -->

<main id="map-wrapper">

    <div id="map-container">

        <img
            id="map"
            src="test.png"
            draggable="false"
            alt="校内地図"
        >

        <div id="selection"></div>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
